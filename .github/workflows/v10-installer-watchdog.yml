name: NongFon v10 Installer + Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '6,21,36,51 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: nongfon-v10-installer-watchdog
  cancel-in-progress: false

jobs:
  install-or-rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
      ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
      SITE_URL: https://${{ github.repository_owner }}.github.io/nongfon-samutprakan/
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide mode
        id: mode
        shell: python
        run: |
          import json, pathlib, datetime, os
          manual = "${{ github.event_name }}" == "workflow_dispatch"
          stale = manual
          age = 9999.0
          p = pathlib.Path('data/radar_status.json')
          if not manual and p.exists():
              try:
                  x=json.loads(p.read_text(encoding='utf-8'))
                  t=datetime.datetime.fromisoformat(x.get('generated_at',''))
                  if t.tzinfo is None: t=t.replace(tzinfo=datetime.timezone.utc)
                  age=(datetime.datetime.now(datetime.timezone.utc)-t).total_seconds()/60
                  stale=age>18
              except Exception:
                  stale=True
          print(f'manual={manual} public_age={age:.1f} stale={stale}')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'manual={str(manual).lower()}\n')
              f.write(f'stale={str(stale).lower()}\n')

      - name: Install v10 code (manual run only)
        if: steps.mode.outputs.manual == 'true'
        shell: bash
        run: |
          true
          cat > /tmp/index_html.b64 <<'NONGFON_B64'
