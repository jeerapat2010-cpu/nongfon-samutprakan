      - name: Validate installed code
        if: steps.mode.outputs.manual == 'true'
        run: python -m py_compile scripts/radar_intelligence.py

      - name: Commit v10 code
        if: steps.mode.outputs.manual == 'true'
        shell: bash
        run: |
          git config user.name "nongfon-v10-installer"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js scripts/radar_intelligence.py V10_README.md
          if git diff --cached --quiet; then
            echo "v10 code already installed"
          else
            git commit -m "feat: install NongFon v10 Final Accuracy"
            git pull --rebase origin main
            git push origin main
          fi

      - uses: actions/setup-python@v5
        if: steps.mode.outputs.stale == 'true'
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install analyzer dependencies
        if: steps.mode.outputs.stale == 'true'
        run: pip install -r requirements.txt

      - name: Run v10 analyzer with retry
        if: steps.mode.outputs.stale == 'true'
        shell: bash
        run: |
          set -e
          git pull --rebase origin main || true
          for n in 1 2 3; do
            echo "v10 analyzer attempt $n/3"
            if python scripts/radar_intelligence.py; then exit 0; fi
            if [ "$n" -lt 3 ]; then sleep 20; fi
          done
          exit 1

      - name: Publish OneSignal public App ID
        if: steps.mode.outputs.stale == 'true' && env.ONESIGNAL_APP_ID != ''
        shell: python
        run: |
          import os
          app=os.environ['ONESIGNAL_APP_ID'].strip()
          open('push-config.js','w',encoding='utf-8').write('// Auto-generated. App ID is public by design.\nwindow.NONGFON_PUSH_CONFIG = {onesignalAppId: "'+app+'"};\n')

      - name: Commit v10 live intelligence
        if: steps.mode.outputs.stale == 'true'
        shell: bash
        run: |
          git config user.name "nongfon-v10-watchdog"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json push-config.js 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No live intelligence change"
          else
            git commit -m "chore: update NongFon v10 intelligence"
            git pull --rebase origin main
            git push origin main
          fi
