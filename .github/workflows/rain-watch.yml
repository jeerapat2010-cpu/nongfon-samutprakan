name: NongFon Rain Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: write

concurrency:
  group: nongfon-rain-watch
  cancel-in-progress: true

jobs:
  analyze-rain:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
      ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
      SITE_URL: https://${{ github.repository_owner }}.github.io/nongfon-samutprakan/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install analyzer
        run: pip install -r requirements.txt

      - name: Analyze TMD radar and forecast
        run: python scripts/radar_intelligence.py

      - name: Publish public OneSignal App ID
        if: env.ONESIGNAL_APP_ID != ''
        shell: python
        run: |
          import os
          app=os.environ["ONESIGNAL_APP_ID"].strip()
          open("push-config.js","w",encoding="utf-8").write(
              '// Auto-generated by GitHub Actions. App ID is public by design.\n'
              'window.NONGFON_PUSH_CONFIG = {onesignalAppId: "'+app+'"};\n'
          )

      - name: Commit live status when changed
        run: |
          git config user.name "nongfon-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/radar_status.json data/radar_state.json push-config.js
          if git diff --cached --quiet; then
            echo "No public status change"
          else
            git commit -m "chore: update NongFon radar intelligence"
            git pull --rebase origin main
            git push origin main
          fi
